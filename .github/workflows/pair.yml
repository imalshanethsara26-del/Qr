name: Generate WhatsApp Session

on:
  workflow_dispatch:

jobs:
  run-pair-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Pairing Script
        run: node pair.js

